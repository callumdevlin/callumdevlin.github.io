# Site settings
# Theme docs: https://hydejack.com/docs/

title:                 Callum Devlin
lang:                  en-GB
email:                 caldev3109@gmail.com
github:                callumdevlin
linkedin:              callumdev

# Short line shown in the sidebar under the site title
tagline:               Mechatronics Engineer

# Longer description used for SEO / search previews
description: >-
  Engineering projects and technical notes by Callum Devlin: rotary-engine
  lubrication, automotive mechanical design, PCB and embedded systems, a
  researched Mazda RX-8 workshop notebook and the maths behind a Rocket League bot.

baseurl:               ""
url:                   "https://callumdevlin.github.io"

# Default social-preview image for pages that do not set their own `image:`
image:                 /Images/enduraomp-engine-1.webp

# Sidebar navigation
menu:
  - title:             About
    url:               /about/
  - title:             Projects
    url:               /ProjectPages/
  - title:             RX-8 Notebook
    url:               /ProjectPages/RX8/
  - title:             Rocket League
    url:               /ProjectPages/rlbot/
  - title:             Search
    url:               /search/

accent_image:          /Images/pcbbg.jpeg
accent_color:          rgb(127,0,255)
theme_color:           rgb(25,55,71)

copyright:             © Callum Devlin 2026. All Rights Reserved.

# Build settings
# Pinned to the tag the live site renders today (the old `@v9` is a moving branch).
remote_theme:          hydecorp/hydejack@v9.2.1

google_fonts:          Roboto+Slab:700|Noto+Sans:400,400i,700,700i

font:                  Noto Sans, Helvetica, Arial, sans-serif
font_heading:          Roboto Slab, Helvetica, Arial, sans-serif
font_code:             Fira Code, Menlo, Monaco, Consolas, monospace;

kramdown:
  math_engine:         mathjax
  math_engine_opts:    {}
  footnote_backlink:   '&#x21a9;&#xfe0e;'

# Never published. (Jekyll skips underscore folders anyway; this makes it explicit
# and also keeps local tooling files out of the output.)
exclude:
  - _maintenance/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - AUTHORING.md
  - CLAUDE.md
  - AGENTS.md

# Authored content uses the `notebook` layout (title block, status line, contents
# navigation, next/previous). Pages elsewhere (home, about, 404, search) set their
# own layout in front matter.
defaults:
  - scope:
      path:            ""
    values:
      layout:          page
  - scope:
      path:            "ProjectPages"
    values:
      layout:          notebook
      search:          true

hydejack:
  post_addons:         [about, comments]
  project_addons:      [about, other, comments]

  no_mark_external:    true
  no_push_state:       false
  no_drawer:           false
  no_navbar:           false
  no_search:           true     # the free theme has no search UI; see /search/
  no_inline_css:       false
  no_page_style:       true
  no_break_layout:     true
  no_toc:              true     # the theme's floating contents box is replaced by the notebook layout's own
  no_third_column:     true
  no_large_headings:   true
  no_structured_data:  false
  no_theme_color:      false
  no_breadcrumbs:      false
  use_lsi:             false
  advertise:           false

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-remote-theme
