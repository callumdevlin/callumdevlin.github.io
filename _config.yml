# Site settings
# Theme docs: https://hydejack.com/docs/

title:                 Callum Devlin
email:                 caldev3109@gmail.com
github:                callumdevlin
linkedin:              callumdev

# Short line shown in the sidebar under the site title
tagline:               Product Design Engineer

# Longer description used for SEO / search previews
description: >-
  Portfolio and engineering notes of Callum Devlin — Product Design Engineer.
  Mechatronics projects spanning automotive mechanical design, rotary engines,
  PCB design and embedded systems, plus public reference notes on the
  Mazda RX-8 13B-MSP.

baseurl:               ""
url:                   "https://callumdevlin.github.io"

# Sidebar navigation
menu:
  - title:             About
    url:               /about/
  - title:             Projects
    url:               /ProjectPages/
  - title:             RX-8 Notes
    url:               /ProjectPages/RX8/

accent_image:          /Images/pcbbg.jpeg
accent_color:          rgb(127,0,255)
theme_color:           rgb(25,55,71)

copyright:             © Callum Devlin 2026. All Rights Reserved.

# Build settings
remote_theme:          hydecorp/hydejack@v9

google_fonts:          Roboto+Slab:700|Noto+Sans:400,400i,700,700i

font:                  Noto Sans, Helvetica, Arial, sans-serif
font_heading:          Roboto Slab, Helvetica, Arial, sans-serif
font_code:             Fira Code, Menlo, Monaco, Consolas, monospace;

kramdown:
  math_engine:         mathjax
  math_engine_opts:    {}
  footnote_backlink:   '&#x21a9;&#xfe0e;'

# Every page uses the Hydejack `page` layout unless it says otherwise,
# so new pages get a proper title header and description box for free.
defaults:
  - scope:
      path:            ""
    values:
      layout:          page

hydejack:
  post_addons:         [about, comments]
  project_addons:      [about, other, comments]

  no_mark_external:    true
  no_push_state:       false
  no_drawer:           false
  no_navbar:           false
  no_search:           false
  no_inline_css:       false
  no_page_style:       true
  no_break_layout:     true
  no_toc:              true
  no_third_column:     true
  no_large_headings:   true
  no_structured_data:  false
  no_theme_color:      false
  no_breadcrumbs:      false
  use_lsi:             false
  advertise:           false

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
