<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Series 1 coolant routing</title><desc id="desc">Functional hose-routing diagram showing pump, engine, thermostat, radiator, heater, throttle loop, expansion tank, cold bypass and warm radiator flow.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0 L10 3.5 L0 7z" fill="context-stroke"/></marker></defs>
<style>
text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:25px;font-weight:700}.label{font-size:14px}.small{font-size:12px;fill:#60717d}.box-title{font-size:15px;font-weight:700}.line{stroke:#60717d;stroke-width:2;fill:none}.arrow{stroke:#176b87;stroke-width:3;fill:none}.hot{stroke:#c85f20;stroke-width:4;fill:none}.cold{stroke:#176b87;stroke-width:4;fill:none}.dash{stroke-dasharray:8 6}.grid{stroke:#d8e1e5;stroke-width:1}.box{fill:#edf4f6;stroke:#176b87;stroke-width:2}.warn{fill:#fbebeb;stroke:#a73535;stroke-width:2}.good{fill:#e6f3ec;stroke:#2f7d5a;stroke-width:2}
</style><rect width="100%" height="100%" fill="white"/><text x="42" y="42" class="title" text-anchor="start">Series 1 coolant routing</text><rect x="60" y="215" width="145" height="70" rx="9" class="box"/><text x="132.5" y="243" class="box-title" text-anchor="middle">Water pump</text><text x="132.5" y="265" class="small" text-anchor="middle">thermostat inlet</text><rect x="270" y="190" width="175" height="120" rx="9" class="box"/><text x="357.5" y="218" class="box-title" text-anchor="middle">Engine housings</text><text x="357.5" y="240" class="small" text-anchor="middle">front · intermediate · rear</text><rect x="535" y="215" width="145" height="70" rx="9" class="box"/><text x="607.5" y="243" class="box-title" text-anchor="middle">Thermostat</text><text x="607.5" y="265" class="small" text-anchor="middle">80–84°C starts</text><rect x="785" y="180" width="155" height="140" rx="9" class="box"/><text x="862.5" y="208" class="box-title" text-anchor="middle">Radiator</text><text x="862.5" y="230" class="small" text-anchor="middle">upper feed / lower return</text><rect x="285" y="390" width="145" height="70" rx="9" class="box"/><text x="357.5" y="418" class="box-title" text-anchor="middle">Heater matrix</text><text x="357.5" y="440" class="small" text-anchor="middle">RHD firewall</text><rect x="515" y="390" width="145" height="70" rx="9" class="box"/><text x="587.5" y="418" class="box-title" text-anchor="middle">Throttle body</text><text x="587.5" y="440" class="small" text-anchor="middle">warming loop</text><rect x="720" y="55" width="180" height="80" rx="9" class="box"/><text x="810.0" y="83" class="box-title" text-anchor="middle">Expansion tank</text><text x="810.0" y="105" class="small" text-anchor="middle">degas and bleed</text><line x1="205" y1="250" x2="270" y2="250" class="cold" marker-end="url(#arrow)"/><line x1="445" y1="230" x2="535" y2="230" class="hot" marker-end="url(#arrow)"/><line x1="680" y1="230" x2="785" y2="230" class="hot" marker-end="url(#arrow)"/><p