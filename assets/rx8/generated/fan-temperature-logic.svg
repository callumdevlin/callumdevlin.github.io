<title id="title">Series 1 cooling-fan temperature logic</title><desc id="desc">Fan low and high thresholds with falling-temperature hysteresis.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0 L10 3.5 L0 7z" fill="context-stroke"/></marker></defs>
<style>
text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:25px;font-weight:700}.label{font-size:14px}.small{font-size:12px;fill:#60717d}.box-title{font-size:15px;font-weight:700}.line{stroke:#60717d;stroke-width:2;fill:none}.arrow{stroke:#176b87;stroke-width:3;fill:none}.hot{stroke:#c85f20;stroke-width:4;fill:none}.cold{stroke:#176b87;stroke-width:4;fill:none}.dash{stroke-dasharray:8 6}.grid{stroke:#d8e1e5;stroke-width:1}.box{fill:#edf4f6;stroke:#176b87;stroke-width:2}.warn{fill:#fbebeb;stroke:#a73535;stroke-width:2}.good{fill:#e6f3ec;stroke:#2f7d5a;stroke-width:2}
</style><rect width="100%" height="100%" fill="white"/><text x="42" y="42" class="title" text-anchor="start">Series 1 cooling-fan temperature logic</text><line x1="100.0" y1="105" x2="100.0" y2="455" class="grid"/><text x="100.0" y="477" class="small" text-anchor="middle">90°</text><line x1="153.33333333333334" y1="105" x2="153.33333333333334" y2="455" class="grid"/><text x="153.33333333333334" y="477" class="small" text-anchor="middle">91°</text><line x1="206.66666666666669" y1="105" x2="206.66666666666669" y2="455" class="grid"/><text x="206.66666666666669" y="477" class="small" text-anchor="middle">92°</text><line x1="260.0" y1="105" x2="260.0" y2="455" class="grid"/><text x="260.0" y="477" class="small" text-anchor="middle">93°</text><line x1="313.33333333333337" y1="105" x2="313.33333333333337" y2="455" class="grid"/><text x="313.33333333333337" y="477" class="small" text-anchor="middle">94°</text><line x1="366.66666666666663" y1="105" x2="366.66666666666663" y2="455" class="grid"/><text x="366.66666666666663" y="477" class="small" text-anchor="middle">95°</text><line x1="420.0" y1="105" x2="420.0" y2="455" class="grid"/><text x="420.0" y="477" class="small" text-anchor="middle">96°</text><line x1="473.3333333333333" y1="105" x2="473.3333333333333" y2="455" class="grid"/><text x="473.3333333333333" y="477" class="small" text-anchor="middle">97°</text><line x1="526.6666666666667" y1="105" x2="526.6666666666667" y2="455" class="grid"/><text x="526.6666666666667" y="477" class="small" text-anchor="middle">98°</text><line x1="580.0" y1="105" x2="580.0" y2="455" class="grid"/><text x="580.0" y="477" class="small" text-anchor="middle">99°</text><line x1="633.3333333333333" y1="105" x2="633.3333333333333" y2="455" class="grid"/><text x="633.3333333333333" y="477" class="small" text-anchor="middle">100°</text><line x1="686.6666666666666" y1="105" x2="686.6666666666666" y2="455" class="grid"/><text x="686.6666666666666" y="477" class="small" text-anchor="middle">101°</text><line x1="740.0" y1="105" x2="740.0" y2="455" class="grid"/><text x="740.0" y="477" class="small" text-anchor="middle">102°</text><line x1="793.3333333333334" y1="105" x2="793.3333333333334" y2="455" class="grid"/><text x="793.3333333333334" y="477" class="small" text-anchor="middle">103°</text><line x1="846.6666666666666" y1="105" x2="846.6666666666666" y2="455" class="grid"/><text x="846.6666666666666" y="477" class="small" text-anchor="middle">104°</text><line x1="900.0" y1="105" x2="900.0" y2="455" class="grid"/><text x="900.0" y="477" class="small" text-anchor="middle">105°</text><text x="95" y="88" class="label" text-anchor="start">Coolant temperature</text><rect x="100.0" y="135" width="373.3333333333333" height="38" rx="5" fill="#dceaf0" stroke="#61717a"/><text x="286.66666666666663" y="159" class="label" text-anchor="middle">Rising: off</text><rect x="473.3333333333333" y="210" width="213.33333333333331" height="38" rx="5" fill="#b8dfcf" stroke="#61717a"/><text x="580.0" y="234" class="label" text-anchor="middle">Rising: both low</text><rect x="686.6666666666666" y="285" width="213.33333333333337" height="38" rx="5" fill="#efb5a5" stroke="#61717a"/><text x="793.3333333333333" y="309" class="label" text-anchor="middle">Rising: both high</text><rect x="526.6666666666667" y="360" width="373.33333333333326" height="38" rx="5" fill="#f3caac" stroke="#61717a"/><text x="713.3333333333334" y="384" class="label" text-anchor="middle">Falling: high → low at 98°C</text><rect x="313.33333333333337" y="420" width="213.33333333333337" height="38" rx="5" fill="#cce5d9" stroke="#61717a"/><text x="420.00000000000006" y="444" class="label" text-anchor="middle">Falling: low → off at 94°C</text><text x="500" y="525" class="small" text-anchor="middle">A/C pressure can request fans independently; ECT failure requests high speed.</text></svg>